name: Polyglot CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -------------------------------------------------------------
  # 1. Java Backend Tests
  # -------------------------------------------------------------
  test-java:
    name: Java Backend (Spring Boot 3.2, Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Tests
        working-directory: backend-java
        run: mvn clean test

  # -------------------------------------------------------------
  # 2. Go Microservice Tests
  # -------------------------------------------------------------
  test-go:
    name: Go Notifier (Go 1.23, Concurrency, Kafka)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: notifier-go/go.sum

      - name: Run Go Tests with Race Detector
        working-directory: notifier-go
        run: go test -v -race ./...

      - name: Build Go Static Binary
        working-directory: notifier-go
        run: CGO_ENABLED=0 GOOS=linux go build -o notifier ./cmd/notifier

  # -------------------------------------------------------------
  # 3. Docker Verification
  # -------------------------------------------------------------
  docker-build:
    name: Docker Build Validation
    needs: [test-java, test-go]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Java Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-java
          push: false

      - name: Build Go Image
        uses: docker/build-push-action@v5
        with:
          context: ./notifier-go
          push: false
